# Prepended by MessengerWorkflowBundle. Applications provide the DSNs for the
# commands/queries/events broker transports; everything else here is the workflow
# baseline (overridable by the application config).
framework:
    messenger:
        serializer:
            default_serializer: messenger.transport.symfony_serializer
            symfony_serializer:
                format: json
                context: { }
        default_bus: event.bus

        buses:
            command.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
                    allow_no_senders: false
                middleware:
                    - messenger_workflow.message_id_middleware
                    - messenger_workflow.amqp_routing_middleware
                    - messenger_workflow.transaction_middleware
                    # Inside the transaction: captures tracked command results into the
                    # notifier outbox; the innermost check enforces exactly one handler.
                    - messenger_workflow.command_notifier_middleware
                    - messenger_workflow.exactly_one_handler_middleware

            query.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
                    allow_no_senders: false
                middleware:
                    - messenger_workflow.message_id_middleware
                    - messenger_workflow.amqp_routing_middleware
                    # The handler worker writes the query result to the result storage;
                    # the innermost check enforces exactly one handler.
                    - messenger_workflow.query_result_middleware
                    - messenger_workflow.exactly_one_handler_middleware

            event.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
                    allow_no_senders: false
                middleware:
                    - messenger_workflow.message_id_middleware
                    - messenger_workflow.amqp_routing_middleware
                    - messenger_workflow.transaction_middleware

            # Internal: consumed by broker receiver workers to move messages into inboxes.
            inbox.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
                    allow_no_senders: true
                middleware:
                    - messenger_workflow.inbox_relay_middleware

            # Internal: consumed by notifier outbox workers to publish tracked command
            # results to the result storage (messenger:consume <x>_notifier --bus=notifier.bus).
            notifier.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
                    allow_no_senders: true
                middleware:
                    - messenger_workflow.result_notifier_middleware

            # Internal: consumed by outbox publisher workers to relay rows to the broker.
            relay.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
                    allow_no_senders: true
                middleware:
                    - messenger_workflow.outbox_relay_middleware

        transports:
            commands:
                options:
                    auto_setup: false
                    exchange:
                        name: commands
                        type: direct
                    delay:
                        exchange:
                            name: commands.delay
                            type: direct

            queries:
                options:
                    auto_setup: false
                    exchange:
                        name: queries
                        type: direct
                    delay:
                        exchange:
                            name: queries.delay
                            type: direct

            events:
                options:
                    auto_setup: false
                    exchange:
                        name: events
                        type: topic

        routing:
            'Kraz\MessengerWorkflow\Domain\DomainEventInterface': events
            'Kraz\MessengerWorkflow\Application\CommandInterface': commands
            'Kraz\MessengerWorkflow\Application\QueryInterface': queries
